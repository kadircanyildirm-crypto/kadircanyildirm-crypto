<svg width="1000" height="96" viewBox="0 0 1000 96" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Currently building wardyn: kernel-level warden for AI coding agents, open source, AGPL-3.0">
  <defs><style>
    .lbl  { font-family:'Segoe UI',-apple-system,Helvetica,Arial,sans-serif; }
    .data { font-family:'SF Mono',Consolas,'Cascadia Code',Menlo,monospace; }

    /* A single "live" signal: the ring expands and fades from the dot. */
    @keyframes ping { 0%{ transform:scale(1); opacity:.7; } 80%,100%{ transform:scale(3.2); opacity:0; } }
    .ping { transform-box:fill-box; transform-origin:center; animation: ping 2.2s cubic-bezier(0,0,.2,1) infinite; }

    @media (prefers-reduced-motion: reduce) { *{ animation:none !important; } }
  </style></defs>

  <rect x="0.5" y="0.5" width="999" height="95" fill="#130A10" stroke="#33202A" stroke-width="1"/>
  <line x1="0" y1="0" x2="1000" y2="0" stroke="#5E3746" stroke-width="1"/>

  <circle class="ping" cx="50" cy="48" r="6" fill="none" stroke="#F04A6B" stroke-width="1.5" opacity="0"/>
  <circle cx="50" cy="48" r="6" fill="#F04A6B"/>

  <line x1="82" y1="24" x2="82" y2="72" stroke="#5E3746" stroke-width="1"/>

  <text x="102" y="42" class="data" font-size="12" fill="#9A7E88" letter-spacing="3">CURRENTLY BUILDING</text>
  <text x="102" y="68" class="lbl" font-size="18" fill="#BCA0AA"><tspan font-weight="700" fill="#F8EFF2">wardyn</tspan> — kernel-level warden for AI coding agents, open source</text>

  <text x="968" y="42" text-anchor="end" class="data" font-size="12" fill="#9A7E88" letter-spacing="2">LICENSE</text>
  <text x="968" y="68" text-anchor="end" class="data" font-size="15" fill="#F04A6B">AGPL-3.0</text>
</svg>
