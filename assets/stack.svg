  <text x="286" y="199" class="val">eBPF (Aya) <tspan class="sep">·</tspan> LSM hooks <tspan class="sep">·</tspan> tracepoints <tspan class="sep">·</tspan> Linux <tspan class="sep">·</tspan> Docker / OCI <tspan class="sep">·</tspan> Kubernetes</text>

