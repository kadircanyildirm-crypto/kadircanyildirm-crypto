      .data { font-family:'SF Mono',Consolas,'Cascadia Code',Menlo,monospace; }
      .hd   { font-family:'SF Mono',Consolas,'Cascadia Code',Menlo,monospace; font-size:11.5px; fill:#9A7E88; letter-spacing:2px; }
      .ref  { font-family:'SF Mono',Consolas,'Cascadia Code',Menlo,monospace; font-size:12px; fill:#9A7E88; }
      .cat  { font-family:'SF Mono',Consolas,'Cascadia Code',Menlo,monospace; font-size:12.5px; fill:#A88C96; letter-spacing:1.4px; }
      .val  { font-family:'Segoe UI',-apple-system,Helvetica,Arial,sans-serif; font-size:15px; fill:#DCC3CC; }
      .sep  { fill:#743E50; }
    </style>
  </defs>

  <rect width="1000" height="340" fill="#0B0709"/>
