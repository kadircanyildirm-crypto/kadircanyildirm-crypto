<svg width="1000" height="340" viewBox="0 0 1000 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Stack: Rust, Python, Go, Kotlin; eBPF, Linux, Kubernetes; gossip, CRDT, P2P; Ed25519, AES-256-GCM, SP1 zkVM; PostgreSQL, MongoDB, S3">
  <defs>
