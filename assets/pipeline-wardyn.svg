<svg width="1000" height="360" viewBox="0 0 1000 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="wardyn architecture — runtime containment for AI coding agents">
  <defs>
    <pattern id="g1" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#331111" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#7A2A2D"/>
    </marker>
    <marker id="arrowA" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#C8161D"/>
    </marker>
    <style>
      .lbl  { font-family:'Segoe UI',Helvetica,Arial,sans-serif; }
      .data { font-family:'SF Mono',Consolas,'Cascadia Code',monospace; }
      .node { fill:#260D0D; stroke:#562022; stroke-width:1; }

      /* Marching dashes read as data in motion; the packet dots ride the same
         paths so the direction of flow is unambiguous. */
      @keyframes flow     { to { stroke-dashoffset:-16; } }
      @keyframes flowSlow { to { stroke-dashoffset:-24; } }
      @keyframes glow     { 0%,100%{ stroke-opacity:1; } 50%{ stroke-opacity:.45; } }
      @keyframes breathe  { 0%,100%{ opacity:.45; } 50%{ opacity:1; } }
      @keyframes frameScan{ to { stroke-dashoffset:-2716; } }
      @keyframes packet   { 0%{ transform:translateX(0); opacity:0; } 10%{ opacity:1; } 90%{ opacity:1; } 100%{ transform:translateX(50px); opacity:0; } }
      @keyframes packetS  { 0%{ transform:translateX(0); opacity:0; } 10%{ opacity:1; } 90%{ opacity:1; } 100%{ transform:translateX(30px); opacity:0; } }

      .flow  { stroke-dasharray:3 5; animation: flow .9s linear infinite; }
      .flowA { stroke-dasharray:3 5; animation: flow .7s linear infinite; }
      .ctrl  { stroke-dasharray:1 4; animation: flowSlow 1.6s linear infinite; }
      .active{ animation: glow 2.4s ease-in-out infinite; }
      .frameScan { stroke-dasharray:120 2596; animation: frameScan 9s linear infinite; }
      .reg { animation: breathe 4.5s ease-in-out infinite; }
      .reg:nth-of-type(2){ animation-delay:1.1s; }
      .reg:nth-of-type(3){ animation-delay:2.2s; }
      .reg:nth-of-type(4){ animation-delay:3.3s; }
      .p1 { fill:#7A2A2D; animation: packet .9s linear infinite; }
      .p2 { fill:#7A2A2D; animation: packet .9s linear infinite .2s; }
      .p3 { fill:#7A2A2D; animation: packet .9s linear infinite .4s; }
      .p4 { fill:#C8161D; animation: packetS .7s linear infinite; }

      .wash { animation: breathe 11s ease-in-out infinite; }


      


      @media (prefers-reduced-motion: reduce) { *{ animation:none !important; } }
    </style>
    <radialGradient id="wglow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8E1219" stop-opacity="0.26"/>
      <stop offset="0.62" stop-color="#8E1219" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1000" height="360" fill="#1E0A0A"/>
  <rect width="1000" height="360" fill="url(#g1)"/>
  <ellipse class="wash" cx="190" cy="110" rx="470" ry="470" fill="url(#wglow)"/>
  <rect x="0.5" y="0.5" width="999" height="359" fill="none" stroke="#4A1A1C"/>
  <rect x="0.5" y="0.5" width="999" height="359" fill="none" stroke="#C8161D" stroke-width="1.5" class="frameScan" opacity="0.85"/>

  <text x="32" y="38" class="data" font-size="10.5" fill="#9E5A5C" letter-spacing="3">01 — SYSTEM ARCHITECTURE</text>
  <text x="32" y="60" class="lbl" font-size="18" font-weight="700" fill="#FBEFEE">wardyn · Runtime Agent Containment</text>
  <text x="32" y="80" class="lbl" font-size="12" fill="#CB979A">every file, exec and socket an AI agent touches → judged in kernel space, refused before it lands</text>

  <g>
    <rect x="32" y="122" width="152" height="80" class="node"/>
    <path d="M32 122h10M32 122v10M184 122h-10M184 122v10M32 202h10M32 202v-10M184 202h-10M184 202v-10" stroke="#7A2A2D" stroke-width="1"/>
    <text x="52" y="150" class="lbl" font-size="13.5" font-weight="700" fill="#FBEFEE">Coding Agent</text>
    <text x="52" y="167" class="data" font-size="9.5" fill="#AE686A">untrusted userspace</text>
    <text x="52" y="180" class="data" font-size="9.5" fill="#AE686A">open · execve · connect</text>

    <rect x="238" y="122" width="164" height="80" class="node"/>
    <path d="M238 122h10M238 122v10M402 122h-10M402 122v10M238 202h10M238 202v-10M402 202h-10M402 202v-10" stroke="#7A2A2D" stroke-width="1"/>
    <text x="258" y="150" class="lbl" font-size="13.5" font-weight="700" fill="#FBEFEE">eBPF Probes</text>
    <text x="258" y="167" class="data" font-size="9.5" fill="#AE686A">LSM hooks · tracepoints</text>
    <text x="258" y="180" class="data" font-size="9.5" fill="#AE686A">Aya · no kernel module</text>

    <rect x="456" y="122" width="172" height="80" class="node"/>
    <path d="M456 122h10M456 122v10M628 122h-10M628 122v10M456 202h10M456 202v-10M628 202h-10M628 202v-10" stroke="#7A2A2D" stroke-width="1"/>
    <text x="476" y="150" class="lbl" font-size="13.5" font-weight="700" fill="#FBEFEE">Policy Engine</text>
    <text x="476" y="167" class="data" font-size="9.5" fill="#AE686A">path · argv · peer match</text>
    <text x="476" y="180" class="data" font-size="9.5" fill="#AE686A">deny by default</text>

    <rect x="682" y="122" width="150" height="80" class="node"/>
    <path d="M682 122h10M682 122v10M832 122h-10M832 122v10M682 202h10M682 202v-10M832 202h-10M832 202v-10" stroke="#7A2A2D" stroke-width="1"/>
    <text x="702" y="150" class="lbl" font-size="13.5" font-weight="700" fill="#FBEFEE">Verdict</text>
    <text x="702" y="167" class="data" font-size="9.5" fill="#AE686A">allow · or EPERM</text>
    <text x="702" y="180" class="data" font-size="9.5" fill="#AE686A">decided pre-syscall</text>

    <rect class="active" x="866" y="122" width="102" height="80" fill="#430F13" stroke="#C8161D" stroke-width="1.25"/>
    <text x="886" y="156" class="lbl" font-size="14" font-weight="700" fill="#F79E96">Audit</text>
    <text x="886" y="175" class="data" font-size="9.5" fill="#CE7E77">ring buffer</text>

    <line class="flow" x1="184" y1="162" x2="234" y2="162" stroke="#7A2A2D" stroke-width="1.25" marker-end="url(#arrow)"/>
    <line class="flow" x1="402" y1="162" x2="452" y2="162" stroke="#7A2A2D" stroke-width="1.25" marker-end="url(#arrow)"/>
    <line class="flow" x1="628" y1="162" x2="678" y2="162" stroke="#7A2A2D" stroke-width="1.25" marker-end="url(#arrow)"/>
    <line class="flowA" x1="832" y1="162" x2="862" y2="162" stroke="#C8161D" stroke-width="1.5" marker-end="url(#arrowA)"/>

    <circle class="p1" cx="184" cy="162" r="2.2"/>
    <circle class="p2" cx="402" cy="162" r="2.2"/>
    <circle class="p3" cx="628" cy="162" r="2.2"/>
    <circle class="p4" cx="832" cy="162" r="2.4"/>
  </g>

  <g>
    <rect x="238" y="256" width="164" height="66" class="node"/>
    <text x="258" y="282" class="lbl" font-size="12.5" font-weight="700" fill="#F1D5D5">Kernel Boundary</text>
    <text x="258" y="300" class="data" font-size="9.5" fill="#AE686A">agent cannot reach past it</text>
    <path class="ctrl" d="M320 256 C320 234 400 210 452 194" fill="none" stroke="#93343A" stroke-width="1"/>

    <rect x="456" y="256" width="172" height="66" class="node"/>
    <text x="476" y="282" class="lbl" font-size="12.5" font-weight="700" fill="#F1D5D5">Hot Ruleset Reload</text>
    <text x="476" y="300" class="data" font-size="9.5" fill="#AE686A">swap policy, no restart</text>
    <path class="ctrl" d="M542 256 C542 236 600 214 678 196" fill="none" stroke="#93343A" stroke-width="1"/>

    <text x="32" y="296" class="data" font-size="9.5" fill="#82484A">— — — control / governs, not data flow</text>
  </g>

  <g>
    <rect x="782" y="308" width="186" height="42" fill="none" stroke="#4A1A1C" stroke-width="1"/>
    <line x1="782" y1="322" x2="968" y2="322" stroke="#4A1A1C" stroke-width="1"/>
    <text x="790" y="318" class="data" font-size="9" fill="#9E5A5C">DWG NO.</text>
    <text x="960" y="318" class="data" font-size="9" fill="#CB979A" text-anchor="end">KC-010</text>
    <text x="790" y="336" class="data" font-size="9" fill="#9E5A5C">SYSTEM</text>
    <text x="960" y="336" class="data" font-size="9" fill="#CB979A" text-anchor="end">WARDYN · REV 07.26</text>
  </g>

  <g stroke="#7A2A2D" stroke-width="1.25">
    <path class="reg" d="M20 12 h14 M12 20 v14" fill="none"/>
    <path class="reg" d="M980 12 h-14 M988 20 v14" fill="none"/>
    <path class="reg" d="M20 348 h14 M12 340 v-14" fill="none"/>
    <path class="reg" d="M980 348 h-14 M988 340 v-14" fill="none"/>
  </g>
</svg>
