<svg width="1000" height="290" viewBox="0 0 1000 290" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Kadir Can Yildirim — Systems Engineer, Rust, kernel-level and distributed infrastructure">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1D1219" stroke-width="1"/>
    </pattern>
    <clipPath id="logClip"><rect x="632" y="94" width="308" height="98"/></clipPath>
    <linearGradient id="fadeBottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B0709" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0B0709" stop-opacity="1"/>
    </linearGradient>
    <style>
      .disp { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; }
      .lbl  { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; }
      .data { font-family: 'SF Mono', Consolas, 'Cascadia Code', monospace; }

      /* Nothing here depends on animation to be legible: every element is drawn
         in a finished state and the keyframes only add motion on top. */
      @keyframes breathe  { 0%,100%{ opacity:.45; } 50%{ opacity:1; } }
      @keyframes pulseDot { 0%,100%{ opacity:1; transform:scale(1); } 50%{ opacity:.5; transform:scale(.78); } }
      @keyframes scrollLog{ 0%{ transform:translateY(0); } 100%{ transform:translateY(-126px); } }
      @keyframes blinkCur { 0%,100%{ opacity:1; } 50%{ opacity:0; } }

      .reg       { animation: breathe 4.5s ease-in-out infinite; }
      .reg:nth-of-type(2) { animation-delay: 1.1s; }
      .reg:nth-of-type(3) { animation-delay: 2.2s; }
      .reg:nth-of-type(4) { animation-delay: 3.3s; }
      .marker    { animation: pulseDot 2.6s ease-in-out infinite; transform-origin: 243.5px 186px; }
      .logscroll { animation: scrollLog 9s linear infinite; }
      .cursor    { animation: blinkCur 1s step-end infinite; }

      .wash { animation: breathe 11s ease-in-out infinite; }


      


      @media (prefers-reduced-motion: reduce) { *{ animation:none !important; } }
    </style>
    <radialGradient id="hglow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#C81E45" stop-opacity="0.16"/>
      <stop offset="0.62" stop-color="#C81E45" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1000" height="290" fill="#0B0709"/>
  <rect width="1000" height="290" fill="url(#grid)"/>
  <ellipse class="wash" cx="760" cy="90" rx="430" ry="430" fill="url(#hglow)"/>
  <rect x="0.5" y="0.5" width="999" height="289" fill="none" stroke="#33202A" stroke-width="1"/>

  <text x="56" y="54" class="lbl" font-size="11" font-weight="600" fill="#856872" letter-spacing="3">IDENTIFICATION — GITHUB / KADIRCANYILDIRM-CRYPTO</text>

  <text x="54" y="128" class="disp" font-size="54" font-weight="700" fill="#F8EFF2" letter-spacing="-1.6">Kadir Can Yıldırım</text>
  <text x="56" y="160" class="lbl" font-size="14" font-weight="600" fill="#F04A6B" letter-spacing="3">SYSTEMS ENGINEER · RUST</text>

  <g stroke="#5E3746" stroke-width="1">
    <line x1="56" y1="182" x2="56" y2="190"/>
    <line x1="56" y1="186" x2="430" y2="186"/>
    <line x1="430" y1="182" x2="430" y2="190"/>
  </g>
  <rect class="marker" x="240" y="182.5" width="7" height="7" fill="#C81E45" transform="rotate(45 243.5 186)"/>

  <text x="56" y="214" class="lbl" font-size="13.5" fill="#BCA0AA">Kernel-level enforcement, distributed coordination without central</text>
  <text x="56" y="234" class="lbl" font-size="13.5" fill="#BCA0AA">brokers, and applied cryptography — designed and shipped end to end.</text>

  <!-- Live audit trail: the same seven lines twice, scrolled by exactly their
       height, so the loop has no visible seam. -->
  <g>
    <line x1="620" y1="70" x2="620" y2="200" stroke="#33202A" stroke-width="1"/>
    <rect x="632" y="94" width="308" height="98" fill="none" stroke="#33202A" stroke-width="1"/>
    <text x="632" y="86" class="data" font-size="10" fill="#6F5762">AUDIT LOG — wardyn · tail -f</text>
    <rect class="cursor" x="880" y="76" width="6" height="11" fill="#C81E45"/>

    <g clip-path="url(#logClip)">
      <g class="logscroll">
        <g class="data" font-size="10.5">
          <text x="640" y="110"><tspan fill="#C81E45">[ebpf]</tspan><tspan fill="#B99AA4"> lsm/file_open attached</tspan></text>
          <text x="640" y="128"><tspan fill="#C81E45">[exec]</tspan><tspan fill="#B99AA4"> /usr/bin/curl · denied</tspan></text>
          <text x="640" y="146"><tspan fill="#C81E45">[net]</tspan><tspan fill="#B99AA4">  connect 10.0.0.7:443 · ok</tspan></text>
          <text x="640" y="164"><tspan fill="#C81E45">[fs]</tspan><tspan fill="#B99AA4">   write /etc/shadow · blocked</tspan></text>
          <text x="640" y="182"><tspan fill="#C81E45">[pol]</tspan><tspan fill="#B99AA4">  ruleset reloaded · 41 rules</tspan></text>
          <text x="640" y="200"><tspan fill="#7FA089">[ok]</tspan><tspan fill="#B99AA4">   agent session clean</tspan></text>
          <text x="640" y="218"><tspan fill="#C81E45">[git]</tspan><tspan fill="#B99AA4">  wardyn · main synced</tspan></text>
        </g>
        <g class="data" font-size="10.5" transform="translate(0,126)">
          <text x="640" y="110"><tspan fill="#C81E45">[ebpf]</tspan><tspan fill="#B99AA4"> lsm/file_open attached</tspan></text>
          <text x="640" y="128"><tspan fill="#C81E45">[exec]</tspan><tspan fill="#B99AA4"> /usr/bin/curl · denied</tspan></text>
          <text x="640" y="146"><tspan fill="#C81E45">[net]</tspan><tspan fill="#B99AA4">  connect 10.0.0.7:443 · ok</tspan></text>
          <text x="640" y="164"><tspan fill="#C81E45">[fs]</tspan><tspan fill="#B99AA4">   write /etc/shadow · blocked</tspan></text>
          <text x="640" y="182"><tspan fill="#C81E45">[pol]</tspan><tspan fill="#B99AA4">  ruleset reloaded · 41 rules</tspan></text>
          <text x="640" y="200"><tspan fill="#7FA089">[ok]</tspan><tspan fill="#B99AA4">   agent session clean</tspan></text>
          <text x="640" y="218"><tspan fill="#C81E45">[git]</tspan><tspan fill="#B99AA4">  wardyn · main synced</tspan></text>
        </g>
      </g>
    </g>
    <rect x="632" y="94" width="308" height="14" fill="#0B0709"/>
    <rect x="632" y="178" width="308" height="14" fill="url(#fadeBottom)"/>
  </g>

  <g>
    <rect x="782" y="228" width="162" height="42" fill="none" stroke="#33202A" stroke-width="1"/>
    <line x1="782" y1="242" x2="944" y2="242" stroke="#33202A" stroke-width="1"/>
    <text x="790" y="238" class="data" font-size="9" fill="#856872">DWG NO.</text>
    <text x="936" y="238" class="data" font-size="9" fill="#BCA0AA" text-anchor="end">KC-001</text>
    <text x="790" y="256" class="data" font-size="9" fill="#856872">SHEET</text>
    <text x="936" y="256" class="data" font-size="9" fill="#BCA0AA" text-anchor="end">PROFILE · REV 07.26</text>
  </g>

  <g stroke="#5E3746" stroke-width="1.25">
    <path class="reg" d="M20 12 h14 M12 20 v14" fill="none"/>
    <path class="reg" d="M980 12 h-14 M988 20 v14" fill="none"/>
    <path class="reg" d="M20 278 h14 M12 270 v-14" fill="none"/>
    <path class="reg" d="M980 278 h-14 M988 270 v-14" fill="none"/>
  </g>
</svg>
