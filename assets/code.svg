<svg width="1000" height="450" viewBox="0 0 1000 450" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Source excerpt from wardyn-ebpf: the LSM file_open enforcement path">
  <defs>
    <pattern id="g5" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#331111" stroke-width="1"/>
    </pattern>
    <style>
      .lbl  { font-family:'Segoe UI',Helvetica,Arial,sans-serif; }
      .data { font-family:'SF Mono',Consolas,'Cascadia Code',monospace; }
      .code { font-family:'SF Mono',Consolas,'Cascadia Code',monospace; font-size:11.5px; fill:#D0A2A5; }
      .kw   { fill:#F0665C; }
      .cmt  { fill:#8E5052; }
      .fnc  { fill:#F1D5D5; }
      .cst  { fill:#DC9E97; }
      .num  { fill:#CB979A; }
      .ln   { font-family:'SF Mono',Consolas,'Cascadia Code',monospace; font-size:10px; fill:#78383A; }

      /* The listing is always fully drawn — nothing is hidden behind an
         animation. A caret and a faint highlight step down one line at a time,
         which reads as the code being walked through rather than revealed. */
      @keyframes step   { from { transform:translateY(0); } to { transform:translateY(240px); } }
      @keyframes blink  { 0%,100%{ opacity:1; } 50%{ opacity:0; } }
      @keyframes breathe{ 0%,100%{ opacity:.45; } 50%{ opacity:1; } }

      .row   { animation: step 6s steps(16, end) infinite; }
      .cur   { animation: step 6s steps(16, end) infinite, blink 1s step-end infinite; }
      .reg   { animation: breathe 4.5s ease-in-out infinite; }
      .reg:nth-of-type(2){ animation-delay:1.1s; }
      .reg:nth-of-type(3){ animation-delay:2.2s; }
      .reg:nth-of-type(4){ animation-delay:3.3s; }

      .wash { animation: breathe 11s ease-in-out infinite; }


      


      @media (prefers-reduced-motion: reduce) { *{ animation:none !important; } }
    </style>
    <radialGradient id="cglow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8E1219" stop-opacity="0.26"/>
      <stop offset="0.62" stop-color="#8E1219" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1000" height="450" fill="#1E0A0A"/>
  <rect width="1000" height="450" fill="url(#g5)"/>
  <ellipse class="wash" cx="140" cy="380" rx="480" ry="480" fill="url(#cglow)"/>
  <rect x="0.5" y="0.5" width="999" height="449" fill="none" stroke="#4A1A1C"/>

  <text x="32" y="38" class="data" font-size="10.5" fill="#9E5A5C" letter-spacing="3">06 — SOURCE EXCERPT</text>
  <text x="32" y="60" class="lbl" font-size="18" font-weight="700" fill="#FBEFEE">wardyn-ebpf / src / main.rs</text>
  <text x="32" y="80" class="lbl" font-size="12" fill="#CB979A">the real enforcement path — a blocked open returns EPERM before the filesystem is ever touched</text>

  <rect x="32" y="106" width="936" height="276" fill="#260D0D" stroke="#562022"/>
  <line x1="76" y1="106" x2="76" y2="382" stroke="#4A1A1C"/>

  <rect class="row" x="77" y="114" width="890" height="16" fill="#C8161D" opacity="0.055"/>
  <rect class="cur" x="46" y="118" width="3" height="12" fill="#C8161D"/>

  <g>
    <g class="ln" text-anchor="end">
      <text x="68" y="126">1</text><text x="68" y="142">2</text><text x="68" y="158">3</text><text x="68" y="174">4</text>
      <text x="68" y="190">5</text><text x="68" y="206">6</text><text x="68" y="222">7</text><text x="68" y="238">8</text>
      <text x="68" y="254">9</text><text x="68" y="270">10</text><text x="68" y="286">11</text><text x="68" y="302">12</text>
      <text x="68" y="318">13</text><text x="68" y="334">14</text><text x="68" y="350">15</text><text x="68" y="366">16</text>
    </g>

    <g class="code">
      <text x="90"  y="126"><tspan class="kw">fn</tspan> <tspan class="fnc">try_file_open</tspan>(ctx: &amp;<tspan class="num">LsmContext</tspan>) -&gt; <tspan class="num">Result</tspan>&lt;<tspan class="num">i32</tspan>, <tspan class="num">i64</tspan>&gt; {</text>
      <text x="118" y="142"><tspan class="kw">if</tspan> <tspan class="fnc">cfg</tspan>(<tspan class="cst">CFG_ENFORCE</tspan>) == <tspan class="cst">0</tspan> {</text>
      <text x="145" y="158"><tspan class="kw">return</tspan> <tspan class="cst">Ok</tspan>(<tspan class="cst">OK</tspan>);</text>
      <text x="118" y="174">}</text>
      <text x="118" y="190"><tspan class="kw">let</tspan> pid = (<tspan class="fnc">bpf_get_current_pid_tgid</tspan>() &gt;&gt; <tspan class="cst">32</tspan>) <tspan class="kw">as</tspan> <tspan class="num">u32</tspan>;</text>
      <text x="118" y="206"><tspan class="kw">if</tspan> !<tspan class="fnc">is_watched</tspan>(pid) {</text>
      <text x="145" y="222"><tspan class="kw">return</tspan> <tspan class="cst">Ok</tspan>(<tspan class="cst">OK</tspan>);</text>
      <text x="118" y="238">}</text>
      <text x="118" y="254" class="cmt">// struct file* -&gt; f_path.dentry -&gt; d_name.name</text>
      <text x="118" y="270"><tspan class="kw">let</tspan> file: *<tspan class="kw">const</tspan> <tspan class="num">u8</tspan> = <tspan class="kw">unsafe</tspan> { ctx.<tspan class="fnc">arg</tspan>(<tspan class="cst">0</tspan>) };</text>
      <text x="118" y="286"><tspan class="kw">let</tspan> dentry = <tspan class="fnc">read_ptr</tspan>(file, <tspan class="cst">FILE_DENTRY_OFF</tspan>)?;</text>
      <text x="118" y="302"><tspan class="kw">let</tspan> <tspan class="kw">mut</tspan> name = [<tspan class="cst">0u8</tspan>; <tspan class="cst">NAME_LEN</tspan>];</text>
      <text x="118" y="318"><tspan class="fnc">read_name</tspan>(dentry, &amp;<tspan class="kw">mut</tspan> name)?;</text>
      <text x="118" y="334"><tspan class="kw">if</tspan> <tspan class="kw">unsafe</tspan> { <tspan class="cst">BLOCK_NAMES</tspan>.<tspan class="fnc">get</tspan>(&amp;<tspan class="num">NameKey</tspan>(name)).<tspan class="fnc">is_some</tspan>() } {</text>
      <text x="145" y="350"><tspan class="kw">return</tspan> <tspan class="cst">Ok</tspan>(<tspan class="cst">EPERM</tspan>);</text>
      <text x="118" y="366">}</text>
    </g>
  </g>

  <g>
    <rect x="782" y="396" width="186" height="42" fill="none" stroke="#4A1A1C" stroke-width="1"/>
    <line x1="782" y1="410" x2="968" y2="410" stroke="#4A1A1C" stroke-width="1"/>
    <text x="790" y="406" class="data" font-size="9" fill="#9E5A5C">DWG NO.</text>
    <text x="960" y="406" class="data" font-size="9" fill="#CB979A" text-anchor="end">KC-020</text>
    <text x="790" y="424" class="data" font-size="9" fill="#9E5A5C">SOURCE</text>
    <text x="960" y="424" class="data" font-size="9" fill="#CB979A" text-anchor="end">WARDYN · AGPL-3.0</text>
  </g>

  <g stroke="#7A2A2D" stroke-width="1.25">
    <path class="reg" d="M20 12 h14 M12 20 v14" fill="none"/>
    <path class="reg" d="M980 12 h-14 M988 20 v14" fill="none"/>
    <path class="reg" d="M20 438 h14 M12 430 v-14" fill="none"/>
    <path class="reg" d="M980 438 h-14 M988 430 v-14" fill="none"/>
  </g>
</svg>
