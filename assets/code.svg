<svg width="1000" height="470" viewBox="0 0 1000 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Source excerpt from wardyn-ebpf: the LSM file_open enforcement path, traced down to return Ok(EPERM)">
  <defs>
    <pattern id="g5" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#1D1219" stroke-width="1"/>
    </pattern>
    <radialGradient id="cglow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#C81E45" stop-opacity="0.14"/>
      <stop offset="0.62" stop-color="#C81E45" stop-opacity="0"/>
    </radialGradient>
    <style>
      .lbl  { font-family:'Segoe UI',-apple-system,Helvetica,Arial,sans-serif; }
      .data { font-family:'SF Mono',Consolas,'Cascadia Code',Menlo,monospace; }
      .code { font-family:'SF Mono',Consolas,'Cascadia Code',Menlo,monospace; font-size:13.5px; fill:#C3ABB4; }
      .kw   { fill:#F2718F; }
      .cmt  { fill:#806571; }
      .fnc  { fill:#EBD9E0; }
      .cst  { fill:#DCA5B3; }
      .num  { fill:#BCA0C6; }
      .ln   { font-family:'SF Mono',Consolas,'Cascadia Code',Menlo,monospace; font-size:12px; fill:#6B5059; }

      /* A trace of the deny path: the highlight follows the branches a
         blocked open actually takes (skipping the early returns), then holds
         on return Ok(EPERM). Every step is exactly one 19px line. Base
         attributes are the final frame, for reduced-motion viewers. */
      @keyframes trace {
        0%  { transform:translateY(-266px); }
        6%  { transform:translateY(-247px); }
        12% { transform:translateY(-190px); }
        18% { transform:translateY(-171px); }
        24% { transform:translateY(-95px); }
        30% { transform:translateY(-76px); }
        36% { transform:translateY(-57px); }
        42% { transform:translateY(-38px); }
        48% { transform:translateY(-19px); }
        54%,100% { transform:translateY(0); }
      }
      @keyframes hot   { 0%,53.9%{ opacity:.08; } 54%,100%{ opacity:.24; } }
      @keyframes note  { 0%,53.9%{ opacity:0; } 54%,100%{ opacity:1; } }
      @keyframes blink { 0%,100%{ opacity:1; } 50%{ opacity:0; } }

      .row  { animation: trace 8s step-end infinite, hot 8s step-end infinite; }
      .cur  { animation: trace 8s step-end infinite, blink 1s step-end infinite; }
      .note { animation: note 8s step-end infinite; }

      @media (prefers-reduced-motion: reduce) { *{ animation:none !important; } }
    </style>
  </defs>

  <rect width="1000" height="470" fill="#0B0709"/>
  <rect width="1000" height="470" fill="url(#g5)"/>
  <ellipse cx="140" cy="380" rx="480" ry="480" fill="url(#cglow)"/>
  <rect x="0.5" y="0.5" width="999" height="469" fill="none" stroke="#33202A"/>

  <text x="32" y="40" class="data" font-size="12" fill="#9A7E88" letter-spacing="3">02 — SOURCE EXCERPT</text>
  <text x="32" y="68" class="lbl" font-size="22" font-weight="700" fill="#F8EFF2">wardyn-ebpf / src / main.rs</text>
  <text x="32" y="92" class="lbl" font-size="14" fill="#BCA0AA">the real enforcement path: a blocked open returns EPERM before the filesystem is ever touched</text>

  <rect x="32" y="112" width="936" height="328" fill="#130A10" stroke="#3E2430"/>
  <line x1="80" y1="112" x2="80" y2="440" stroke="#33202A"/>

  <rect class="row" x="81" y="390" width="886" height="19" fill="#C81E45" opacity="0.24"/>
  <rect class="cur" x="40" y="393" width="3" height="13" fill="#F04A6B"/>

  <g class="ln" text-anchor="end">
    <text x="70" y="138">1</text><text x="70" y="157">2</text><text x="70" y="176">3</text><text x="70" y="195">4</text>
    <text x="70" y="214">5</text><text x="70" y="233">6</text><text x="70" y="252">7</text><text x="70" y="271">8</text>
    <text x="70" y="290">9</text><text x="70" y="309">10</text><text x="70" y="328">11</text><text x="70" y="347">12</text>
    <text x="70" y="366">13</text><text x="70" y="385">14</text><text x="70" y="404">15</text><text x="70" y="423">16</text>
  </g>

  <g class="code">
    <text x="96"  y="138"><tspan class="kw">fn</tspan> <tspan class="fnc">try_file_open</tspan>(ctx: &amp;<tspan class="num">LsmContext</tspan>) -&gt; <tspan class="num">Result</tspan>&lt;<tspan class="num">i32</tspan>, <tspan class="num">i64</tspan>&gt; {</text>
    <text x="126" y="157"><tspan class="kw">if</tspan> <tspan class="fnc">cfg</tspan>(<tspan class="cst">CFG_ENFORCE</tspan>) == <tspan class="cst">0</tspan> {</text>
    <text x="156" y="176"><tspan class="kw">return</tspan> <tspan class="cst">Ok</tspan>(<tspan class="cst">OK</tspan>);</text>
    <text x="126" y="195">}</text>
    <text x="126" y="214"><tspan class="kw">let</tspan> pid = (<tspan class="fnc">bpf_get_current_pid_tgid</tspan>() &gt;&gt; <tspan class="cst">32</tspan>) <tspan class="kw">as</tspan> <tspan class="num">u32</tspan>;</text>
    <text x="126" y="233"><tspan class="kw">if</tspan> !<tspan class="fnc">is_watched</tspan>(pid) {</text>
    <text x="156" y="252"><tspan class="kw">return</tspan> <tspan class="cst">Ok</tspan>(<tspan class="cst">OK</tspan>);</text>
    <text x="126" y="271">}</text>
    <text x="126" y="290" class="cmt">// struct file* -&gt; f_path.dentry -&gt; d_name.name</text>
    <text x="126" y="309"><tspan class="kw">let</tspan> file: *<tspan class="kw">const</tspan> <tspan class="num">u8</tspan> = <tspan class="kw">unsafe</tspan> { ctx.<tspan class="fnc">arg</tspan>(<tspan class="cst">0</tspan>) };</text>
    <text x="126" y="328"><tspan class="kw">let</tspan> dentry = <tspan class="fnc">read_ptr</tspan>(file, <tspan class="cst">FILE_DENTRY_OFF</tspan>)?;</text>
    <text x="126" y="347"><tspan class="kw">let</tspan> <tspan class="kw">mut</tspan> name = [<tspan class="cst">0u8</tspan>; <tspan class="cst">NAME_LEN</tspan>];</text>
    <text x="126" y="366"><tspan class="fnc">read_name</tspan>(dentry, &amp;<tspan class="kw">mut</tspan> name)?;</text>
    <text x="126" y="385"><tspan class="kw">if</tspan> <tspan class="kw">unsafe</tspan> { <tspan class="cst">BLOCK_NAMES</tspan>.<tspan class="fnc">get</tspan>(&amp;<tspan class="num">NameKey</tspan>(name)).<tspan class="fnc">is_some</tspan>() } {</text>
    <text x="156" y="404"><tspan class="kw">return</tspan> <tspan class="cst">Ok</tspan>(<tspan class="cst">EPERM</tspan>);</text>
    <text x="126" y="423">}</text>
  </g>

  <text class="note lbl" x="340" y="404" font-size="13" fill="#F04A6B">← id_ed25519 stops here: the open never reaches the filesystem</text>

  <g stroke="#5E3746" stroke-width="1.25" fill="none">
    <path d="M20 12 h14 M12 20 v14"/>
    <path d="M980 12 h-14 M988 20 v14"/>
    <path d="M20 458 h14 M12 450 v-14"/>
    <path d="M980 458 h-14 M988 450 v-14"/>
  </g>
</svg>
