  <text x="50" y="366" class="data" font-size="10" fill="#AE686A">09</text>
  <text x="110" y="366" class="name">E.L.I.Z.A</text>
  <text x="434" y="366" class="lang">Python</text>
  <text x="954" y="366" class="acc" text-anchor="end">PRIVATE</text>

  <rect class="r n10" x="38" y="382" width="3" height="13" fill="#C8161D"/>
  <text x="50" y="394" class="data" font-size="10" fill="#AE686A">10</text>
  <text x="110" y="394" class="name">XAI--SAGLIK-PROJESI</text>
  <text x="434" y="394" class="lang">Python</text>
  <text x="954" y="394" class="acc" text-anchor="end">PRIVATE</text>

  <g>
    <rect x="782" y="416" width="186" height="42" fill="none" stroke="#4A1A1C" stroke-width="1"/>
    <line x1="782" y1="430" x2="968" y2="430" stroke="#4A1A1C" stroke-width="1"/>
    <text x="790" y="426" class="data" font-size="9" fill="#9E5A5C">DWG NO.</text>
    <text x="960" y="426" class="data" font-size="9" fill="#CB979A" text-anchor="end">KC-040</text>
    <text x="790" y="444" class="data" font-size="9" fill="#9E5A5C">REGISTER</text>
    <text x="960" y="444" class="data" font-size="9" fill="#CB979A" text-anchor="end">SYSTEMS · REV 07.26</text>
  </g>

  <g stroke="#7A2A2D" stroke-width="1.25">
    <path class="reg" d="M20 12 h14 M12 20 v14" fill="none"/>
    <path class="reg" d="M980 12 h-14 M988 20 v14" fill="none"/>
    <path class="reg" d="M20 458 h14 M12 450 v-14" fill="none"/>
    <path class="reg" d="M980 458 h-14 M988 450 v-14" fill="none"/>
  </g>
</svg>
