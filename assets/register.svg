<svg width="1000" height="394" viewBox="0 0 1000 394" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Project register: 7 open-source systems — wardyn, low-latency-matching-engine, quaestor, petek, heliofloor, nabd, spacewasm-crossbuild">
  <defs>
