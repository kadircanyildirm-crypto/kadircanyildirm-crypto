      .what { font-family:'Segoe UI',-apple-system,Helvetica,Arial,sans-serif; font-size:14px; fill:#C9AFB8; }
      .lang { font-family:'Segoe UI',-apple-system,Helvetica,Arial,sans-serif; font-size:14px; fill:#A88C96; }
      .sep  { fill:#743E50; }
    </style>
  </defs>

  <rect width="1000" height="394" fill="#0B0709"/>
