  <text x="50" y="282" class="data" font-size="10" fill="#AE686A">06</text>
  <text x="110" y="282" class="name">Tigrawire</text>
  <text x="434" y="282" class="lang">Rust <tspan class="sep">·</tspan> Python</text>
  <text x="954" y="282" class="acc" text-anchor="end">PRIVATE</text>

  <rect class="r n7"  x="38" y="298" width="3" height="13" fill="#C8161D"/>
  <text x="50" y="310" class="data" font-size="10" fill="#AE686A">07</text>
  <text x="110" y="310" class="name">ulak</text>
  <text x="434" y="310" class="lang">Kotlin <tspan class="sep">·</tspan> Rust</text>
  <text x="954" y="310" class="acc" text-anchor="end">PRIVATE</text>

  <rect class="r n8"  x="38" y="326" width="3" height="13" fill="#C8161D"/>
  <text x="50" y="338" class="data" font-size="10" fill="#AE686A">08</text>
  <text x="110" y="338" class="name">Perde</text>
  <text x="434" y="338" class="lang">Go</text>
  <text x="954" y="338" class="acc" text-anchor="end">PRIVATE</text>

