<svg width="1000" height="470" viewBox="0 0 1000 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Project register — ten systems, one open source, nine private">
  <defs>
    <pattern id="g7" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#331111" stroke-width="1"/>
    </pattern>
    <radialGradient id="rglow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8E1219" stop-opacity="0.26"/>
      <stop offset="0.62" stop-color="#8E1219" stop-opacity="0"/>
    </radialGradient>
    <style>
      .lbl  { font-family:'Segoe UI',Helvetica,Arial,sans-serif; }
      .data { font-family:'SF Mono',Consolas,'Cascadia Code',monospace; }
      .name { font-family:'SF Mono',Consolas,'Cascadia Code',monospace; font-size:13px; fill:#EBC7C7; }
      .lang { font-family:'Segoe UI',Helvetica,Arial,sans-serif; font-size:12.5px; fill:#C89195; }
      .acc  { font-family:'SF Mono',Consolas,'Cascadia Code',monospace; font-size:9.5px; fill:#8E5052; letter-spacing:1.6px; }
      .sep  { fill:#93343A; }

      /* Same rule as every other sheet: the register is fully drawn at rest.
         The ticks and the row wash only add motion on top of it. */
      @keyframes tick    { 0%,8%,100%{ opacity:1; } 4%{ opacity:.2; } }
      @keyframes rowScan { 0%,100%{ opacity:0; } 5%,9%{ opacity:.07; } 16%{ opacity:0; } }
      @keyframes breathe { 0%,100%{ opacity:.45; } 50%{ opacity:1; } }

      .r  { animation: tick 8s ease-in-out infinite; }
      .w  { animation: rowScan 8s linear infinite; }
      .n2 { animation-delay:.22s; } .n3 { animation-delay:.44s; } .n4 { animation-delay:.66s; }
      .n5 { animation-delay:.88s; } .n6 { animation-delay:1.1s; } .n7 { animation-delay:1.32s; }
      .n8 { animation-delay:1.54s; } .n9 { animation-delay:1.76s; } .n10{ animation-delay:1.98s; }
      .wash { animation: breathe 11s ease-in-out infinite; }
      .reg { animation: breathe 4.5s ease-in-out infinite; }
      .reg:nth-of-type(2){ animation-delay:1.1s; }
      .reg:nth-of-type(3){ animation-delay:2.2s; }
      .reg:nth-of-type(4){ animation-delay:3.3s; }

      @media (prefers-reduced-motion: reduce) { *{ animation:none !important; } }
    </style>
  </defs>

  <rect width="1000" height="470" fill="#1E0A0A"/>
  <rect width="1000" height="470" fill="url(#g7)"/>
  <ellipse class="wash" cx="150" cy="120" rx="470" ry="470" fill="url(#rglow)"/>
  <rect x="0.5" y="0.5" width="999" height="469" fill="none" stroke="#4A1A1C"/>

  <text x="32" y="38" class="data" font-size="10.5" fill="#9E5A5C" letter-spacing="3">07 — PROJECT REGISTER</text>
  <text x="32" y="66" class="lbl" font-size="18" font-weight="700" fill="#FBEFEE">Systems</text>

  <rect class="w"     x="32" y="122" width="936" height="28" fill="#C8161D" opacity="0"/>
  <rect class="w n2"  x="32" y="150" width="936" height="28" fill="#C8161D" opacity="0"/>
  <rect class="w n3"  x="32" y="178" width="936" height="28" fill="#C8161D" opacity="0"/>
  <rect class="w n4"  x="32" y="206" width="936" height="28" fill="#C8161D" opacity="0"/>
  <rect class="w n5"  x="32" y="234" width="936" height="28" fill="#C8161D" opacity="0"/>
  <rect class="w n6"  x="32" y="262" width="936" height="28" fill="#C8161D" opacity="0"/>
  <rect class="w n7"  x="32" y="290" width="936" height="28" fill="#C8161D" opacity="0"/>
  <rect class="w n8"  x="32" y="318" width="936" height="28" fill="#C8161D" opacity="0"/>
  <rect class="w n9"  x="32" y="346" width="936" height="28" fill="#C8161D" opacity="0"/>
  <rect class="w n10" x="32" y="374" width="936" height="28" fill="#C8161D" opacity="0"/>

  <g stroke="#4A1A1C" stroke-width="1" fill="none">
    <rect x="32" y="96" width="936" height="306"/>
    <line x1="32" y1="122" x2="968" y2="122"/>
    <line x1="32" y1="150" x2="968" y2="150"/>
    <line x1="32" y1="178" x2="968" y2="178"/>
    <line x1="32" y1="206" x2="968" y2="206"/>
    <line x1="32" y1="234" x2="968" y2="234"/>
    <line x1="32" y1="262" x2="968" y2="262"/>
    <line x1="32" y1="290" x2="968" y2="290"/>
    <line x1="32" y1="318" x2="968" y2="318"/>
    <line x1="32" y1="346" x2="968" y2="346"/>
    <line x1="32" y1="374" x2="968" y2="374"/>
    <line x1="96" y1="96" x2="96" y2="402"/>
    <line x1="420" y1="96" x2="420" y2="402"/>
    <line x1="700" y1="96" x2="700" y2="402"/>
  </g>

  <g class="data" font-size="9.5" fill="#9E5A5C" letter-spacing="2">
    <text x="46" y="114">REF</text>
    <text x="110" y="114">PROJECT</text>
    <text x="434" y="114">LANGUAGE</text>
    <text x="954" y="114" text-anchor="end">ACCESS</text>
  </g>

  <rect class="r"     x="38" y="130" width="3" height="13" fill="#C8161D"/>
  <text x="50" y="142" class="data" font-size="10" fill="#AE686A">01</text>
  <text x="110" y="142" class="name" fill="#FBEFEE">wardyn</text>
  <text x="434" y="142" class="lang">Rust</text>
  <text x="954" y="142" class="acc" text-anchor="end" fill="#EC3B31">OPEN</text>

  <rect class="r n2"  x="38" y="158" width="3" height="13" fill="#C8161D"/>
  <text x="50" y="170" class="data" font-size="10" fill="#AE686A">02</text>
  <text x="110" y="170" class="name">Middleware-Karakulak</text>
  <text x="434" y="170" class="lang">Rust</text>
  <text x="954" y="170" class="acc" text-anchor="end">PRIVATE</text>

