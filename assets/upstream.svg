<svg width="1000" height="682" viewBox="0 0 1000 682" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Upstream record — eight patches merged into NASA F Prime, NASA spacewasm and CERN CernVM-FS">
  <defs>
    <pattern id="g9" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#1D1219" stroke-width="1"/>
    </pattern>
    <radialGradient id="uglow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#C81E45" stop-opacity="0.16"/>
      <stop offset="0.62" stop-color="#C81E45" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="uhalo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#C81E45" stop-opacity="0.30"/>
      <stop offset="0.7" stop-color="#C81E45" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="urule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C81E45"/>
      <stop offset="1" stop-color="#C81E45" stop-opacity="0"/>
    </linearGradient>
    <style>
      .lbl  { font-family:'Segoe UI',Helvetica,Arial,sans-serif; }
      .data { font-family:'SF Mono',Consolas,'Cascadia Code',monospace; }
      .name { font-family:'SF Mono',Consolas,'Cascadia Code',monospace; font-size:13px; fill:#E3CDD5; }
      .repo { font-family:'SF Mono',Consolas,'Cascadia Code',monospace; font-size:16px; fill:#F8EFF2; }
      .desc { font-family:'Segoe UI',Helvetica,Arial,sans-serif; font-size:12.5px; fill:#B99AA4; }
      .chip { font-family:'SF Mono',Consolas,'Cascadia Code',monospace; font-size:10.5px; font-weight:700; fill:#0B0709; letter-spacing:1.6px; }
      .acc  { font-family:'SF Mono',Consolas,'Cascadia Code',monospace; font-size:9.5px; fill:#7A5F6A; letter-spacing:1.6px; }
      .meta { font-family:'SF Mono',Consolas,'Cascadia Code',monospace; font-size:9.5px; fill:#856872; letter-spacing:1.6px; }
      .dlt  { font-family:'SF Mono',Consolas,'Cascadia Code',monospace; font-size:10.5px; fill:#7A5F6A; }
      .add  { fill:#BCA0AA; }
      .sep  { fill:#743E50; }

      /* Same rule as every other sheet: the record is fully drawn at rest.
         The ticks, the row wash and the bars only add motion on top of it. */
      @keyframes tick    { 0%,8%,100%{ opacity:1; } 4%{ opacity:.2; } }
      @keyframes rowScan { 0%,100%{ opacity:0; } 5%,9%{ opacity:.07; } 16%{ opacity:0; } }
      @keyframes breathe { 0%,100%{ opacity:.45; } 50%{ opacity:1; } }
      @keyframes halo    { 0%,100%{ opacity:.55; } 50%{ opacity:1; } }

      .r  { animation: tick 8s ease-in-out infinite; }
      .w  { animation: rowScan 8s linear infinite; }
      .n2 { animation-delay:.22s; } .n3 { animation-delay:.44s; } .n4 { animation-delay:.66s; }
      .n5 { animation-delay:.88s; } .n6 { animation-delay:1.1s; } .n7 { animation-delay:1.32s; }
      .n8 { animation-delay:1.54s; }
      .gb { animation: breathe 5.5s ease-in-out infinite; }
      .gb2{ animation-delay:1.3s; } .gb3{ animation-delay:2.6s; }
      .wash { animation: breathe 11s ease-in-out infinite; }
      .halo { animation: halo 6s ease-in-out infinite; }
      .reg { animation: breathe 4.5s ease-in-out infinite; }
      .reg:nth-of-type(2){ animation-delay:1.1s; }
      .reg:nth-of-type(3){ animation-delay:2.2s; }
      .reg:nth-of-type(4){ animation-delay:3.3s; }

      @media (prefers-reduced-motion: reduce) { *{ animation:none !important; } }
    </style>
  </defs>

  <rect width="1000" height="682" fill="#0B0709"/>
  <rect width="1000" height="682" fill="url(#g9)"/>
  <ellipse class="wash" cx="880" cy="120" rx="500" ry="500" fill="url(#uglow)"/>
  <rect x="0.5" y="0.5" width="999" height="681" fill="none" stroke="#33202A"/>
  <rect x="32" y="0" width="380" height="3" fill="url(#urule)"/>

  <text x="32" y="40" class="data" font-size="10.5" fill="#856872" letter-spacing="3">08 — UPSTREAM RECORD</text>
  <text x="32" y="74" class="lbl" font-size="24" font-weight="700" fill="#F8EFF2">Merged upstream</text>
  <text x="32" y="94" class="lbl" font-size="12.5" fill="#BCA0AA">eight patches accepted into NASA and CERN infrastructure</text>

  <!-- Headline band -->
  <rect x="32" y="112" width="936" height="100" fill="#C81E45" opacity="0.05"/>
  <ellipse class="halo" cx="118" cy="162" rx="130" ry="130" fill="url(#uhalo)"/>
  <g stroke="#33202A" stroke-width="1" fill="none">
    <rect x="32" y="112" width="936" height="100"/>
    <line x1="520" y1="112" x2="520" y2="212"/>
    <line x1="744" y1="112" x2="744" y2="212"/>
  </g>
  <rect class="gb" x="32" y="112" width="4" height="100" fill="#C81E45"/>

  <text x="70" y="190" class="data" font-size="72" fill="#F04A6B">08</text>
  <text x="190" y="152" class="lbl" font-size="14" font-weight="700" fill="#F8EFF2" letter-spacing="2.5">PATCHES MERGED UPSTREAM</text>
  <text x="190" y="178" class="data" font-size="11" fill="#95757F" letter-spacing="2">NASA <tspan class="sep">·</tspan> CERN <tspan class="sep">·</tspan> AUGUST 2026</text>

  <text x="632" y="168" class="data" font-size="40" fill="#F8EFF2" text-anchor="middle">03</text>
  <text x="632" y="192" class="meta" text-anchor="middle">UPSTREAM REPOSITORIES</text>
  <text x="856" y="168" class="data" font-size="30" fill="#F8EFF2" text-anchor="middle">+350 <tspan class="sep">/</tspan> -67</text>
  <text x="856" y="192" class="meta" text-anchor="middle">LINES ADDED / REMOVED</text>

  <!-- Row wash -->
  <rect class="w"     x="32" y="290" width="936" height="30" fill="#C81E45" opacity="0"/>
  <rect class="w n2"  x="32" y="320" width="936" height="30" fill="#C81E45" opacity="0"/>
  <rect class="w n3"  x="32" y="350" width="936" height="30" fill="#C81E45" opacity="0"/>
  <rect class="w n4"  x="32" y="380" width="936" height="30" fill="#C81E45" opacity="0"/>
  <rect class="w n5"  x="32" y="452" width="936" height="30" fill="#C81E45" opacity="0"/>
  <rect class="w n6"  x="32" y="482" width="936" height="30" fill="#C81E45" opacity="0"/>
  <rect class="w n7"  x="32" y="512" width="936" height="30" fill="#C81E45" opacity="0"/>
  <rect class="w n8"  x="32" y="584" width="936" height="30" fill="#C81E45" opacity="0"/>

  <!-- Group bands -->
  <rect x="32" y="248" width="936" height="42" fill="#C81E45" opacity="0.07"/>
  <rect x="32" y="410" width="936" height="42" fill="#C81E45" opacity="0.07"/>
  <rect x="32" y="542" width="936" height="42" fill="#C81E45" opacity="0.07"/>

  <g stroke="#33202A" stroke-width="1" fill="none">
    <rect x="32" y="248" width="936" height="366"/>
    <line x1="32" y1="290" x2="968" y2="290"/>
    <line x1="32" y1="320" x2="968" y2="320"/>
    <line x1="32" y1="350" x2="968" y2="350"/>
    <line x1="32" y1="380" x2="968" y2="380"/>
    <line x1="32" y1="410" x2="968" y2="410"/>
    <line x1="32" y1="452" x2="968" y2="452"/>
    <line x1="32" y1="482" x2="968" y2="482"/>
    <line x1="32" y1="512" x2="968" y2="512"/>
    <line x1="32" y1="542" x2="968" y2="542"/>
    <line x1="32" y1="584" x2="968" y2="584"/>
    <line x1="112" y1="290" x2="112" y2="410"/>
    <line x1="800" y1="290" x2="800" y2="410"/>
    <line x1="896" y1="290" x2="896" y2="410"/>
    <line x1="112" y1="452" x2="112" y2="542"/>
    <line x1="800" y1="452" x2="800" y2="542"/>
    <line x1="896" y1="452" x2="896" y2="542"/>
    <line x1="112" y1="584" x2="112" y2="614"/>
    <line x1="800" y1="584" x2="800" y2="614"/>
    <line x1="896" y1="584" x2="896" y2="614"/>
  </g>

  <g class="data" font-size="9.5" fill="#856872" letter-spacing="2">
    <text x="46" y="238">PR</text>
    <text x="130" y="238">UPSTREAM · CHANGE</text>
    <text x="886" y="238" text-anchor="end">DELTA</text>
    <text x="954" y="238" text-anchor="end">MERGED</text>
  </g>

  <!-- 01 — nasa/fprime -->
  <rect class="gb" x="32" y="248" width="5" height="42" fill="#C81E45"/>
  <rect x="48" y="261" width="60" height="20" fill="#C81E45"/>
  <text x="78" y="275" class="chip" text-anchor="middle">NASA</text>
  <text x="130" y="276" class="repo">nasa/fprime</text>
  <text x="300" y="276" class="desc">F´ — flight software and embedded systems framework</text>
  <text x="954" y="276" class="meta" text-anchor="end">C++ <tspan class="sep">·</tspan> 11.6K STARS</text>

  <rect class="r"    x="38" y="299" width="3" height="13" fill="#C81E45"/>
  <text x="52" y="310" class="data" font-size="10.5" fill="#95757F">#5590</text>
  <text x="130" y="310" class="name">Split the flags F Prime requires from the flags it validates against</text>
  <text x="886" y="310" class="dlt" text-anchor="end"><tspan class="add">+131</tspan> / -51</text>
  <text x="954" y="310" class="acc" text-anchor="end">12 AUG</text>

  <rect class="r n2" x="38" y="329" width="3" height="13" fill="#C81E45"/>
  <text x="52" y="340" class="data" font-size="10.5" fill="#95757F">#5576</text>
  <text x="130" y="340" class="name">Stop rewriting overridden configuration files on every configure</text>
  <text x="886" y="340" class="dlt" text-anchor="end"><tspan class="add">+140</tspan> / -7</text>
  <text x="954" y="340" class="acc" text-anchor="end">12 AUG</text>

  <rect class="r n3" x="38" y="359" width="3" height="13" fill="#C81E45"/>
  <text x="52" y="370" class="data" font-size="10.5" fill="#95757F">#5571</text>
  <text x="130" y="370" class="name">Add a regression test for .fppi edits re-running generation</text>
  <text x="886" y="370" class="dlt" text-anchor="end"><tspan class="add">+69</tspan> / -2</text>
  <text x="954" y="370" class="acc" text-anchor="end">04 AUG</text>

  <rect class="r n4" x="38" y="389" width="3" height="13" fill="#C81E45"/>
  <text x="52" y="400" class="data" font-size="10.5" fill="#95757F">#5559</text>
  <text x="130" y="400" class="name">Fix two stale relative links in the component SDDs</text>
  <text x="886" y="400" class="dlt" text-anchor="end"><tspan class="add">+2</tspan> / -2</text>
  <text x="954" y="400" class="acc" text-anchor="end">03 AUG</text>

  <!-- 02 — nasa/spacewasm -->
  <rect class="gb gb2" x="32" y="410" width="5" height="42" fill="#C81E45"/>
  <rect x="48" y="423" width="60" height="20" fill="#C81E45"/>
  <text x="78" y="437" class="chip" text-anchor="middle">NASA</text>
  <text x="130" y="438" class="repo">nasa/spacewasm</text>
  <text x="300" y="438" class="desc">a flight-compliant WebAssembly interpreter</text>
  <text x="954" y="438" class="meta" text-anchor="end">RUST <tspan class="sep">·</tspan> 1.4K STARS</text>

  <rect class="r n5" x="38" y="461" width="3" height="13" fill="#C81E45"/>
  <text x="52" y="472" class="data" font-size="10.5" fill="#95757F">#154</text>
  <text x="130" y="472" class="name">Fix the broken IR spec link in README</text>
  <text x="886" y="472" class="dlt" text-anchor="end"><tspan class="add">+1</tspan> / -1</text>
  <text x="954" y="472" class="acc" text-anchor="end">01 AUG</text>

  <rect class="r n6" x="38" y="491" width="3" height="13" fill="#C81E45"/>
  <text x="52" y="502" class="data" font-size="10.5" fill="#95757F">#153</text>
  <text x="130" y="502" class="name">Silence the stray debug print in fd_fdstat_set_rights</text>
  <text x="886" y="502" class="dlt" text-anchor="end"><tspan class="add">+0</tspan> / -2</text>
  <text x="954" y="502" class="acc" text-anchor="end">01 AUG</text>

  <rect class="r n7" x="38" y="521" width="3" height="13" fill="#C81E45"/>
  <text x="52" y="532" class="data" font-size="10.5" fill="#95757F">#152</text>
  <text x="130" y="532" class="name">Track SPACEWASM_CONFIG changes in the c_api build script</text>
  <text x="886" y="532" class="dlt" text-anchor="end"><tspan class="add">+2</tspan> / -1</text>
  <text x="954" y="532" class="acc" text-anchor="end">01 AUG</text>

  <!-- 03 — cvmfs/cvmfs -->
  <rect class="gb gb3" x="32" y="542" width="5" height="42" fill="#C81E45"/>
  <rect x="48" y="555" width="60" height="20" fill="#C81E45"/>
  <text x="78" y="569" class="chip" text-anchor="middle">CERN</text>
  <text x="130" y="570" class="repo">cvmfs/cvmfs</text>
  <text x="300" y="570" class="desc">CernVM-FS — software distribution for the LHC experiments</text>
  <text x="954" y="570" class="meta" text-anchor="end">C++ <tspan class="sep">·</tspan> 351 STARS</text>

  <rect class="r n8" x="38" y="593" width="3" height="13" fill="#C81E45"/>
  <text x="52" y="604" class="data" font-size="10.5" fill="#95757F">#4392</text>
  <text x="130" y="604" class="name">Find the bootstrapped go compiler</text>
  <text x="886" y="604" class="dlt" text-anchor="end"><tspan class="add">+5</tspan> / -1</text>
  <text x="954" y="604" class="acc" text-anchor="end">03 AUG</text>

  <text x="32" y="654" class="meta">MERGED TO UPSTREAM DEFAULT BRANCHES <tspan class="sep">·</tspan> devel / main <tspan class="sep">·</tspan> 2026</text>

  <g>
    <rect x="782" y="628" width="186" height="42" fill="none" stroke="#33202A" stroke-width="1"/>
    <line x1="782" y1="642" x2="968" y2="642" stroke="#33202A" stroke-width="1"/>
    <text x="790" y="638" class="data" font-size="9" fill="#856872">DWG NO.</text>
    <text x="960" y="638" class="data" font-size="9" fill="#BCA0AA" text-anchor="end">KC-050</text>
    <text x="790" y="656" class="data" font-size="9" fill="#856872">RECORD</text>
    <text x="960" y="656" class="data" font-size="9" fill="#BCA0AA" text-anchor="end">UPSTREAM · REV 08.26</text>
  </g>

  <g stroke="#5E3746" stroke-width="1.25">
    <path class="reg" d="M20 12 h14 M12 20 v14" fill="none"/>
    <path class="reg" d="M980 12 h-14 M988 20 v14" fill="none"/>
    <path class="reg" d="M20 670 h14 M12 662 v-14" fill="none"/>
    <path class="reg" d="M980 670 h-14 M988 662 v-14" fill="none"/>
  </g>
</svg>
